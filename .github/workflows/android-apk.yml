name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'firebase-applet-config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Atelier Virtual Stylist APK
        uses: actions/upload-artifact@v4
        with:
          name: atelier-virtual-stylist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          overwrite: true

      - name: Remove Older APK Artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'atelier-virtual-stylist-apk',
                per_page: 100
              }
            );
            for (const artifact of artifacts) {
              if (artifact.workflow_run?.id !== context.runId) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
